:root {
  --bg: #F4F8F2; --card: #FFFFFF; --ink: #1F2421; --muted: #5B655F;
  --green: #2F6B3A; --green-light: #E9F3E6; --line: #CFE3C8;
  --orange: #F2A65A; --orange-ink: #4A2A0A; --orange-light: #FDEEDC;
  --kontur: #1B2033; --leaf: #6DB85C; --leaf-ink: #2F6B3A;
  --font: 'Inter Schule', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131A15; --card: #1D2620; --ink: #EAF1EA; --muted: #A5B2A8;
  --green: #9AD793; --green-light: #25332A; --line: #36473B;
  --orange: #F2A65A; --orange-ink: #3A2006; --orange-light: #3A2C1C;
  --kontur: #0D1120; --leaf: #4E9442; --leaf-ink: #1C3F22; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131A15; --card: #1D2620; --ink: #EAF1EA; --muted: #A5B2A8;
  --green: #9AD793; --green-light: #25332A; --line: #36473B;
  --orange: #F2A65A; --orange-ink: #3A2006; --orange-light: #3A2C1C;
  --kontur: #0D1120; --leaf: #4E9442; --leaf-ink: #1C3F22; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 500; font-size: 16px; line-height: 1.45;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: 26px; font-weight: 800; margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 62ch; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { font: inherit; font-weight: 800; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--green); border-color: var(--green); color: var(--bg); }
.tab:focus-visible, .opt:focus-visible, .go:focus-visible, .link:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.cols { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
.stage { flex: 0 1 390px; min-width: 0; width: 100%; max-width: 390px; background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px;
  font-feature-settings: 'cv05' 1, 'cv11' 1; }
.scene { background: var(--green-light); border-radius: 14px; overflow: hidden; }
.scene svg, .legende svg { display: block; width: 100%; height: auto; }
.task { display: flex; flex-direction: column; gap: 10px; min-height: 300px; }
.task-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.frage { font-size: 21px; font-weight: 800; margin: 0; }
.bsp { font-size: 13px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 10px; padding: 3px 8px; white-space: nowrap; }
.bild { background: var(--bg); border-radius: 12px; padding: 8px; }
.bild svg { display: block; width: 100%; height: 86px; }
.opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.opts.wenig { grid-template-columns: repeat(4, 1fr); }
.opt { min-width: 0; font: inherit; display: flex; align-items: center; justify-content: center; padding: 5px 2px; border-radius: 14px; border: 2.5px solid transparent; background: none; cursor: pointer; }
.opt svg { width: 100%; max-width: 54px; height: auto; display: block; }
.opt[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-light); }
.opt:disabled { opacity: .5; cursor: default; }
.msg { margin: 0; min-height: 1.45em; font-size: 15px; color: var(--ink); }
.tipp { margin: 0; font-size: 15px; background: var(--orange-light); color: var(--ink); border-radius: 10px; padding: 6px 10px; }
.go { font: inherit; font-size: 19px; font-weight: 800; padding: 13px; border-radius: 14px; border: 0; background: var(--orange); color: var(--orange-ink); cursor: pointer; }
.go:disabled { background: var(--green-light); color: var(--muted); cursor: default; }
.link { font: inherit; font-size: 14px; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; align-self: center; padding: 4px; }
.info { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.info h2 { font-size: 20px; font-weight: 800; margin: 0; }
.info h3 { font-size: 16px; font-weight: 800; margin: 6px 0 0; }
.info p { margin: 0; max-width: 60ch; }
.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.info dt { font-weight: 800; color: var(--green); }
.info dd { margin: 0; min-width: 0; }
.legende { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 8px; max-width: 420px; }
.try { border-left: 4px solid var(--orange); padding-left: 12px; color: var(--muted); }
.tap { cursor: pointer; }
.wob { animation: wob .5s ease-in-out 3; transform-box: fill-box; transform-origin: center; }
@keyframes wob { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-9deg) translateY(-2px) } 75% { transform: rotate(9deg) translateY(2px) } }
.hop { animation: hop .45s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes hop { 0% { transform: scale(.6) } 60% { transform: scale(1.15) } 100% { transform: scale(1) } }
.twin { transition: transform .7s ease-out, opacity .4s; }
@media (prefers-reduced-motion: reduce) { .wob, .hop { animation: none } .twin { transition: none } }
</style>
</head>

<div class="page">
  <h1>Гусеница и её близнец</h1>
  <p class="lead">Каждый ответ становится бусиной. У каждой цифры свой цвет, цифра написана и внутри бусины. Экран слева на немецком, как увидит ребёнок. Ответьте где-нибудь неверно нарочно и нажмите «Vergleichen».</p>

    <button class="tab" role="tab" id="tab-offen" data-v="offen" aria-selected="false">Близнец открытый</button>

      <div class="task" id="task"></div>
      <button class="go" id="go" type="button"></button>
      <button class="link" id="reset" type="button">Noch einmal von vorn</button>

    if (o.zahl) s += '<text x="' + x + '" y="' + (y + r * 0.36) + '" text-anchor="middle" font-size="' + (r * (o.zahl > 9 ? 0.86 : 1.02)).toFixed(1) + '" font-weight="800" fill="' + DUNKEL + '" stroke="#fff" stroke-width="' + (r * 0.2).toFixed(1) + '" paint-order="stroke" stroke-linejoin="round">' + o.zahl + '</text>';
    else s += form(o.form, x, y + r * 0.06, r * (o.klein ? 0.3 : 0.42), '#fff', DUNKEL);
    return s + '</g>';
  }
  function leer(x, y, r, nr, extra) {
    return '<g ' + (extra || '') + '><circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="var(--card)" stroke="var(--muted)" stroke-width="2" stroke-dasharray="' + (r * 0.38) + ' ' + (r * 0.3) + '"/>' +
      '<text x="' + x + '" y="' + (y + 6) + '" text-anchor="middle" font-size="17" font-weight="800" fill="var(--muted)">' + nr + '</text></g>';
  }
  function blatt(x, y, cls) {
    return '<g' + (cls ? ' class="' + cls + '"' : '') + '><path d="M' + (x - 28) + ' ' + (y + 4) + ' Q' + (x - 14) + ' ' + (y - 30) + ' ' + (x + 28) + ' ' + (y - 8) + ' Q' + (x + 16) + ' ' + (y + 30) + ' ' + (x - 28) + ' ' + (y + 4) + ' Z" fill="var(--leaf)" stroke="var(--leaf-ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="M' + (x - 24) + ' ' + (y + 3) + ' Q' + x + ' ' + (y - 2) + ' ' + (x + 24) + ' ' + (y - 7) + '" fill="none" stroke="var(--leaf-ink)" stroke-width="2" stroke-linecap="round"/></g>';
  }
  function kopf(x, y, r) { var k = r / 72; return '<image href="' + KOPF + '" x="' + (x - 75.7 * k) + '" y="' + (y - 131.1 * k) + '" width="' + 168 * k + '" height="' + 200 * k + '"/>'; }

  /* ---------- die fünf Aufgaben ---------- */
  var INK = 'var(--ink)';
  var zahlen = function () { var a = []; for (var n = 1; n <= 10; n++) a.push({ zahl: n }); return a; };
  var AUFGABEN = [
    { frage: 'Wie viele Punkte?', bsp: '● ● → 2', tipp: 'Zähle zuerst die fünf oben, dann weiter.',
      bild: function () { var s = ''; [0, 1, 2, 3, 4].forEach(function (i) { s += form('kreis', 70 + i * 40, 28, 12, INK); }); [0, 1].forEach(function (i) { s += form('kreis', 70 + i * 40, 62, 12, INK); }); return s; },
      opts: zahlen(), ok: 6 },
    { frage: 'Wie viele zusammen?', bsp: '● + ● → 2', tipp: 'Zähle alle Äpfel der Reihe nach.',
      bild: function () { var s = ''; [0, 1, 2].forEach(function (i) { s += form('kreis', 50 + i * 36, 45, 14, ZAHL[1]); }); s += '<text x="165" y="56" font-size="32" font-weight="800" text-anchor="middle" fill="' + INK + '">+</text>'; [0, 1].forEach(function (i) { s += form('kreis', 208 + i * 36, 45, 14, ZAHL[5]); }); return s; },
      opts: zahlen(), ok: 4 },
    { frage: 'Was kommt als Nächstes?', bsp: '■ ▲ ■ ▲ → ■', tipp: 'Sprich das Muster laut: Kreis, Dreieck, Kreis, Dreieck …',
      bild: function () { var s = '', m = ['kreis', 'dreieck', 'kreis', 'dreieck', 'kreis']; m.forEach(function (t, i) { s += form(t, 40 + i * 46, 45, 15, t === 'kreis' ? ZAHL[8] : ZAHL[2]); }); s += '<rect x="254" y="27" width="36" height="36" rx="8" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="6 5"/><text x="272" y="54" font-size="24" font-weight="800" text-anchor="middle" fill="var(--muted)">?</text>'; return s; },
      opts: [{ form: 'kreis', f: ZAHL[8] }, { form: 'dreieck', f: ZAHL[2] }, { form: 'quadrat', f: ZAHL[5] }], ok: 1 },
    { frage: 'Was passt nicht dazu?', bsp: '▲ ▲ ● → ●', tipp: 'Drei haben die gleiche Form.',
      bild: function () { return form('kreis', 60, 45, 20, ZAHL[8]) + form('kreis', 130, 45, 13, ZAHL[2]) + form('quadrat', 200, 45, 17, ZAHL[5]) + form('kreis', 270, 45, 17, ZAHL[1]); },
      opts: [{ form: 'kreis', f: ZAHL[8] }, { form: 'kreis', f: ZAHL[2], klein: true }, { form: 'quadrat', f: ZAHL[5] }, { form: 'kreis', f: ZAHL[1] }], ok: 2 },
    { frage: 'Zerlege die 6.', bsp: '3 = 2 und 1', tipp: 'Zähle von 4 weiter bis 6.',
      bild: function () { return '<polygon points="165,6 235,38 95,38" fill="' + ZAHL[6] + '" stroke="' + DUNKEL + '" stroke-width="2"/><text x="165" y="33" font-size="22" font-weight="800" text-anchor="middle" fill="' + DUNKEL + '">6</text>' +
        '<rect x="105" y="38" width="60" height="42" fill="var(--card)" stroke="' + INK + '" stroke-width="2"/><rect x="165" y="38" width="60" height="42" fill="var(--card)" stroke="' + INK + '" stroke-width="2"/>' +
        '<text x="135" y="68" font-size="26" font-weight="800" text-anchor="middle" fill="' + INK + '">4</text><text x="195" y="68" font-size="26" font-weight="800" text-anchor="middle" fill="var(--muted)">?</text>'; },
      opts: zahlen(), ok: 1 }
  ];
  var N = AUFGABEN.length;

  var TEXTE = {
    blatt: { hinweis: 'Unter dem Blatt liegt eine andere Perle. Schau noch einmal hin.', fertig: 'Beide Raupen sind gleich!',
      h: 'Близнец под листьями',
      p: 'Близнец виден с самого начала, но его бусины спрятаны под листьями. По кнопке листья поднимаются только там, где бусины совпали. Где ответ другой, лист остаётся и качается, верный цвет не показан.',
      plus: 'Сравнение двух гусениц остаётся, а подсмотреть ответ нельзя: задание нужно решить заново. После исправления снова нажимается «Vergleichen».',
      minus: 'Проверку можно нажимать несколько раз. Чтобы это не превращалось в перебор, после второго промаха появляется подсказка, а числа вводятся из десяти бусин, а не из трёх вариантов.' },
    offen: { hinweis: 'Tippe auf eine Perle, die anders ist als beim Zwilling.', fertig: 'Beide Raupen sind gleich!',
      h: 'Близнец открытый',
      p: 'Прежний вариант для сравнения: по кнопке близнец выползает целиком, все его бусины видны, несовпавшие качаются.',
      plus: 'Самый простой. Так же выглядит бумажный лист: близнец напечатан на обороте.',
      minus: 'Верный ответ виден сразу: бусину можно перекрасить, не решая задание.' }
  };

  /* ---------- Zustand ---------- */
  var v = 'blatt', ans, cur, phase, fehl, busy, twinDa, offen, wackel, geaendert;
  function neu() { ans = AUFGABEN.map(function () { return null; }); cur = 0; phase = 'loesen'; fehl = AUFGABEN.map(function () { return 0; }); offen = AUFGABEN.map(function () { return false; }); wackel = []; busy = false; twinDa = false; geaendert = true; }
  function richtig(i) { return ans[i] === AUFGABEN[i].ok; }
  function alleRichtig() { return AUFGABEN.every(function (_, j) { return richtig(j); }); }

  /* ---------- Szene ---------- */
  var sceneEl = document.getElementById('scene'), taskEl = document.getElementById('task'), goEl = document.getElementById('go'), infoEl = document.getElementById('info');
  function bx(i) { return 38 + i * 50; }
  function zeichne(hop) {
    var s = defs(), i;
    for (i = 0; i < N; i++) {
      var fest = v === 'blatt' && offen[i];
      var cls = 'tap' + (wackel.indexOf(i) >= 0 ? ' wob' : '') + (hop === i ? ' hop' : '');
      if (i === cur && phase !== 'fertig' && !fest) s += '<circle cx="' + bx(i) + '" cy="74" r="26.5" fill="none" stroke="var(--orange)" stroke-width="3"/>';
      s += ans[i] === null ? leer(bx(i), 74, 22, i + 1, 'class="' + cls + '" data-i="' + i + '"') : perle(bx(i), 74, 22, AUFGABEN[i].opts[ans[i]], 'class="' + cls + '" data-i="' + i + '"');
    }
    s += kopf(300, 68, 30);
    var t = '';
    for (i = 0; i < N; i++) {
      var w = wackel.indexOf(i) >= 0 ? 'wob' : '';
      if (v === 'offen' || offen[i]) t += perle(bx(i), 160, 22, AUFGABEN[i].opts[AUFGABEN[i].ok], w || (hop === -1 - i) ? 'class="' + (w || 'hop') + '"' : '');
      else t += '<circle cx="' + bx(i) + '" cy="160" r="22" fill="var(--card)" stroke="var(--muted)" stroke-width="2"/>' + blatt(bx(i), 160, w);
    }
    t += kopf(300, 154, 30) + '<text x="14" y="124" font-size="13" font-weight="800" fill="var(--muted)">Zwilling</text>';
    var zeigen = v === 'blatt' || twinDa;
    s += '<g class="twin" style="transform: translateX(' + (zeigen ? 0 : -380) + 'px); opacity:' + (zeigen ? 1 : 0) + '">' + t + '</g>';
    sceneEl.innerHTML = '<svg viewBox="0 0 350 196" role="img" aria-label="Raupe mit Perlen, darunter ihr Zwilling">' + s + '</svg>';
  }

  /* ---------- Aufgabe ---------- */
  function zeigeAufgabe(meldung) {
    var t = AUFGABEN[cur], gesperrt = phase === 'fertig' || busy || (v === 'blatt' && offen[cur]);
    var h = '<div class="task-head"><p class="frage">' + t.frage + '</p><span class="bsp">So geht’s: ' + t.bsp + '</span></div>';
    h += '<div class="bild"><svg viewBox="0 0 330 90" aria-hidden="true">' + t.bild() + '</svg></div><div class="opts' + (t.opts.length < 5 ? ' wenig' : '') + '">';
    t.opts.forEach(function (o, k) {
      h += '<button class="opt" type="button" id="opt-' + k + '" data-k="' + k + '" aria-pressed="' + (ans[cur] === k) + '"' + (gesperrt ? ' disabled' : '') + ' aria-label="Antwort ' + (o.zahl || o.form) + '"><svg viewBox="0 0 50 50" aria-hidden="true">' + defs() + perle(25, 25, 21, o) + '</svg></button>';
    });
    h += '</div><p class="msg">' + (meldung || '') + '</p>';
    if (phase === 'reparieren' && v === 'blatt' && fehl[cur] >= 2 && !offen[cur]) h += '<p class="tipp">Tipp: ' + t.tipp + '</p>';
    taskEl.innerHTML = h;
  }
  function knopf() {
    if (phase === 'fertig') { goEl.textContent = TEXTE[v].fertig; goEl.disabled = true; return; }
    var n = ans.filter(function (a) { return a === null; }).length;
    goEl.textContent = n ? 'Noch ' + n + (n === 1 ? ' Aufgabe' : ' Aufgaben') : 'Vergleichen';
    goEl.disabled = n > 0 || busy || (v === 'offen' && twinDa) || (v === 'blatt' && !geaendert);
  }
  function legende() {
    var s = defs();
    for (var n = 1; n <= 10; n++) s += perle(20 + (n - 1) * 39, 22, 17, { zahl: n });
    return '<svg viewBox="0 0 391 44" role="img" aria-label="Zahlenfarben von 1 bis 10">' + s + '</svg>';
  }
  function info() {
    var x = TEXTE[v];
    infoEl.innerHTML = '<h2>' + x.h + '</h2><p>' + x.p + '</p><dl><dt>Плюс</dt><dd>' + x.plus + '</dd><dt>Минус</dt><dd>' + x.minus + '</dd></dl>' +
      '<h3>Цвета цифр</h3><div class="legende">' + legende() + '</div>' +
      '<p>Это десять радужных бусин гусеницы из Lese-Raupe, от головы к хвосту. Цифра всегда написана внутри бусины, поэтому похожие оттенки не путаются и цвет не единственный признак.</p>' +
      '<h3>На бумаге</h3><p>Ребёнок вписывает цифру в бусину и по желанию раскрашивает. Близнец напечатан на обороте листа.</p>' +
      '<p class="try">Попробуйте: ответьте неверно во втором и четвёртом задании и нажмите «Vergleichen».</p>';
  }
  function alles(meldung, hop) { zeichne(hop); zeigeAufgabe(meldung); knopf(); }

  /* ---------- Ablauf ---------- */
  function antworte(k) {
    if (busy || phase === 'fertig' || (v === 'blatt' && offen[cur])) return;
    ans[cur] = k; wackel = []; geaendert = true;
    var i = cur;
    if (v === 'offen' && twinDa) {
      if (alleRichtig()) { phase = 'fertig'; alles(TEXTE.offen.fertig, i); return; }
      wackel = AUFGABEN.map(function (_, j) { return j; }).filter(function (j) { return !richtig(j); });
      alles(TEXTE.offen.hinweis, i); return;
    }
    if (phase === 'loesen') { for (var s = 1; s <= N; s++) { var j = (cur + s) % N; if (ans[j] === null) { cur = j; break; } } }
    alles('', i);
  }
  function pruefe() {
    if (busy || phase === 'fertig' || ans.some(function (a) { return a === null; })) return;
    if (v === 'offen') {
      twinDa = true;
      if (alleRichtig()) { phase = 'fertig'; alles(TEXTE.offen.fertig); return; }
      phase = 'reparieren'; wackel = [];
      for (var j = 0; j < N; j++) if (!richtig(j)) { if (!wackel.length) cur = j; wackel.push(j); }
      alles(TEXTE.offen.hinweis); return;
    }
    busy = true; wackel = []; geaendert = false; alles('');
    var i = 0;
    (function schritt() {
      while (i < N && offen[i]) i++;
      if (i === N) {
        busy = false;
        if (alleRichtig()) { phase = 'fertig'; alles(TEXTE.blatt.fertig); return; }
        phase = 'reparieren';
        for (var j = 0; j < N; j++) if (!offen[j]) { cur = j; break; }
        alles(TEXTE.blatt.hinweis); return;
      }
      if (richtig(i)) { offen[i] = true; zeichne(-1 - i); }
      else { wackel.push(i); fehl[i]++; zeichne(); }
      i++; setTimeout(schritt, T);
    })();
  }

  sceneEl.addEventListener('click', function (e) {
    var g = e.target.closest('[data-i]'); if (!g || busy || phase === 'fertig') return;
    cur = +g.getAttribute('data-i');
    alles(phase === 'reparieren' && !(v === 'blatt' && offen[cur]) ? TEXTE[v].hinweis : '');
  });
  taskEl.addEventListener('click', function (e) { var b = e.target.closest('.opt'); if (b && !b.disabled) antworte(+b.getAttribute('data-k')); });
  goEl.addEventListener('click', pruefe);
  document.getElementById('reset').addEventListener('click', function () { neu(); alles(''); });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
    tab.addEventListener('click', function () {
      v = tab.getAttribute('data-v');
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t2) { t2.setAttribute('aria-selected', String(t2 === tab)); });
      neu(); info(); alles('');
    });
  });

  neu(); info(); alles('');
})();
</script>

</body>
</html>
